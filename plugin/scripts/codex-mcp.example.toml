# Replace <USER> with the current Windows user name, or select this executable
# in Codex/ChatGPT desktop Settings > MCP servers > Add server > STDIO.
[mcp_servers.ai_cad]
command = "C:\\Users\\<USER>\\AppData\\Roaming\\Autodesk\\ApplicationPlugins\\AiCad.bundle\\Contents\\Bridge\\AiCad.Bridge.exe"
startup_timeout_sec = 10
tool_timeout_sec = 30
default_tools_approval_mode = "writes"

[mcp_servers.ai_cad.tools.cad_health]
approval_mode = "approve"

[mcp_servers.ai_cad.tools.cad_get_context]
approval_mode = "approve"

[mcp_servers.ai_cad.tools.cad_get_request_status]
approval_mode = "approve"

[mcp_servers.ai_cad.tools.cad_create_rounded_plate]
approval_mode = "approve"

[mcp_servers.ai_cad.tools.cad_propose_hole_diameter_change]
approval_mode = "approve"

[mcp_servers.ai_cad.tools.cad_cancel_change]
approval_mode = "approve"

[mcp_servers.ai_cad.tools.cad_apply_change]
approval_mode = "prompt"

[mcp_servers.ai_cad.tools.cad_undo_batch]
approval_mode = "prompt"
